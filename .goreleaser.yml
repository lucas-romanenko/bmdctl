# GoReleaser v2. Run by .github/workflows/release.yml when a v* tag is pushed.
# Binaries: macOS arm64/amd64, Windows amd64, Linux amd64/arm64, attached to
# the GitHub release. Image: ghcr.io/lucas-romanenko/bmdctl (linux amd64 and
# arm64 under one manifest).
version: 2

project_name: bmdctl

builds:
  - id: bmdctl
    main: ./cmd/bmdctl
    binary: bmdctl
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - id: bmdctl
    ids: [bmdctl]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - atem/LICENSE
      - atem/LICENSE-gpl3.txt
      - atem/NOTICE

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: bmdctl
    ids: [bmdctl]
    dockerfile: Dockerfile
    images:
      - ghcr.io/lucas-romanenko/bmdctl
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/lucas-romanenko/bmdctl
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT AND LGPL-3.0-only

release:
  github:
    owner: lucas-romanenko
    name: bmdctl
  prerelease: auto

changelog:
  use: github
  sort: asc
