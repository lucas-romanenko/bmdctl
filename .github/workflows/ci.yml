# Build, vet and test on every push and pull request. Nothing here talks to a
# switcher: hardware tests only build with -tags hardware, which CI never sets.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # No go.sum (no dependencies), so there is nothing to key a cache on.
          cache: false
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "gofmt: the files above need formatting (gofmt -w)"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docsite/requirements.txt
      - name: The reference is the command table's
        run: go generate ./cmd/bmdctl && git diff --exit-code docs/
      - name: Install MkDocs
        run: pip install -r docsite/requirements.txt
      - name: Terminal colours match the CLI's goldens
        run: python docsite/test_terminal.py
      - name: Build
        run: mkdocs build --strict
