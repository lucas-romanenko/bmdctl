# Nightly: the session and CLI tests under the race detector, 50 times
# over, for the timing-dependent failures a single run misses (CI's runner
# is slower than a desk, and -race slows it further). One run of each
# package takes 1-1.5 minutes on CI, so 50 take about 75. Nothing here
# talks to a switcher.
name: Nightly

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: race, 50 runs
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./atem ./cmd/bmdctl -race -count=50 -timeout 3h
